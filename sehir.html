<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<meta name="theme-color" content="#06324a">
<meta name="color-scheme" content="light only">

<link rel="stylesheet" href="css/fonts.css?v=1">

<body class="sehir-sayfasi">

<header class="sehir-baslik" id="sehir-baslik">
  <a href="index.html" class="sehir-geri" data-i18n="backToCities">← Şehirler</a>
  <div class="dil-secici sag-ust" id="dil-secici"></div>
  <div class="sehir-baslik-icerik">
    <h1 id="sehir-adi">Şehir</h1>
    <p id="sehir-alt"></p>
  </div>
</header>

<main class="sehir-icerik">
  <section>
    <div class="filtre-baslik-satir">
      <h2 class="sehir-bolum-baslik" data-i18n="filterQuestion">Nasıl bir plaj istersiniz?</h2>
      <button type="button" class="filtre-temizle" id="filtre-temizle" hidden data-i18n="clearFilters">Filtreleri temizle</button>
    </div>
    <div class="filtre-cipleri" id="filtre-cipleri"></div>
  </section>

  <section>
    <h2 class="sehir-bolum-baslik" data-i18n="districtQuestion">Hangi ilçede?</h2>
    <div class="ilce-kartlari" id="ilce-kartlari"></div>
    <p class="filtre-bos" id="filtre-bos" hidden data-i18n="noDistrictMatch">Bu özelliklerin hepsine uyan plaj yok.</p>
  </section>

  <a class="tum-sehir-plajlari" id="tum-sehir-plajlari" href="liste.html"></a>
</main>

<script src="js/i18n.js?v=12"></script>
